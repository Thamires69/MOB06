<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 7 - Cadastro com Select e Radio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            text-align: center;
            background: #f8fafc;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .card {
            background: white;
            max-width: 450px;
            margin: 30px auto;
            padding: 30px;
            border: 1px solid #999;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
        }

        .formulario {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            text-align: left;
        }

        .grupo {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            color: #555;
            font-weight: bold;
        }

        input[type="text"],
        select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #0ea5e9;
            background: #f0f9ff;
        }

        .radios {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .radio-opcao {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-opcao input[type="radio"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .radio-opcao label {
            margin: 0;
            cursor: pointer;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            background-color: #0ea5e9;
            color: white;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0284c7;
        }

        #saida {
            padding: 20px;
            background: #dbeafe;
            color: #1e40af;
            border-radius: 8px;
            font-size: 16px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            justify-content: center;
            text-align: left;
        }

        .titulo-saida {
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            margin-bottom: 12px;
        }

        .dado {
            padding: 8px 0;
            border-bottom: 1px solid rgba(30, 64, 175, 0.2);
        }

        .dado:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>📋 Cadastro Completo</h2>
        
        <div class="formulario">
            <div class="grupo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome" style="width: 100%;">
            </div>

            <div class="grupo">
                <label for="cidade">Cidade:</label>
                <select id="cidade" style="width: 100%;">
                    <option value="">-- Selecione uma cidade --</option>
                    <option value="São Paulo">São Paulo</option>
                    <option value="Rio de Janeiro">Rio de Janeiro</option>
                    <option value="Belo Horizonte">Belo Horizonte</option>
                    <option value="Curitiba">Curitiba</option>
                    <option value="Salvador">Salvador</option>
                </select>
            </div>

            <div class="grupo">
                <label>Tipo de Cliente:</label>
                <div class="radios">
                    <div class="radio-opcao">
                        <input type="radio" id="novo" name="tipo" value="Novo Cliente" checked>
                        <label for="novo">Novo Cliente</label>
                    </div>
                    <div class="radio-opcao">
                        <input type="radio" id="cliente" name="tipo" value="Cliente">
                        <label for="cliente">Cliente</label>
                    </div>
                </div>
            </div>
        </div>

        <button onclick="cadastrar()">Cadastrar</button>

        <div id="saida"></div>
    </div>

    <script>
        function cadastrar() {
            let nome = document.getElementById("nome").value.trim();
            let cidade = document.getElementById("cidade").value.trim();
            let tipo = document.querySelector('input[name="tipo"]:checked').value;
            let saida = document.getElementById("saida");

            if (nome === "" || cidade === "") {
                saida.innerHTML = "<p style='color: #991b1b; background: #fee2e2; padding: 10px; border-radius: 6px; text-align: center;'>⚠️ Por favor, preencha todos os campos!</p>";
                return;
            }

            let mensagem = `
                <div class="titulo-saida">✅ Cadastro Realizado!</div>
                <div class="dado"><strong>Nome:</strong> ${nome}</div>
                <div class="dado"><strong>Cidade:</strong> ${cidade}</div>
                <div class="dado"><strong>Tipo:</strong> ${tipo}</div>
            `;

            saida.innerHTML = mensagem;
        }

        // Permitir cadastro ao pressionar Enter
        document.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                cadastrar();
            }
        });
    </script>
</body>
</html>
